name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        env:
          SECRET_KEY: ci-test-secret-key-not-secret
          DEBUG: 'True'
        run: python manage.py test --verbosity 1

      - name: Summary
        if: always()
        run: |
          echo "CI completed."
          echo "Check: python manage.py check"
          echo "Migrations: python manage.py makemigrations --check --dry-run"
          echo "Tests: python manage.py test --verbosity 1"