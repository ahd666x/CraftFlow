{% for supplier in suppliers %}
<tr data-id="{{ supplier.id }}">
    <td>{{ supplier.name }}</td>
    <td>{{ supplier.phone|default:"-" }}</td>
    <td>{{ supplier.address|truncatechars:50|default:"-" }}</td>
    <td>
        <span class="badge bg-{% if supplier.is_active %}success{% else %}danger{% endif %}">
            {% if supplier.is_active %}فعال{% else %}غیرفعال{% endif %}
        </span>
    </td>
    <td>
        <button class="btn btn-sm btn-outline-primary edit-supplier" data-id="{{ supplier.id }}" data-name="{{ supplier.name }}">
            <i class="bi bi-pencil"></i>
        </button>
        <button class="btn btn-sm btn-outline-danger delete-supplier" data-id="{{ supplier.id }}" data-name="{{ supplier.name }}">
            <i class="bi bi-trash"></i>
        </button>
    </td>
</tr>
{% empty %}
<tr><td colspan="5" class="text-center py-4 text-muted">هیچ تامین‌کننده‌ای یافت نشد</td></tr>
{% endfor %}
